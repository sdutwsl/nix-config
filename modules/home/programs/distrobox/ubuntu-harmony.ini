[ubuntu-harmony]
image=ubuntu:24.04
pull=true
root=false
replace=false
start_now=false
init=false

# HarmonyOS Linux Emulator：硬件虚拟化 + GPU
additional_flags="--device=/dev/kvm"
additional_flags="--device=/dev/dri"

# 基础开发环境
additional_packages="build-essential gcc g++ make cmake ninja-build pkg-config"
additional_packages="git curl wget ca-certificates openssl"
additional_packages="zip unzip xz-utils tar file jq"
additional_packages="python3 python3-pip python3-venv"
additional_packages="fish procps iproute2 iputils-ping usbutils pciutils"

# Java，Hvigor PackageHap 阶段需要
additional_packages="openjdk-17-jdk"

# 基础运行库
additional_packages="libatomic1 libgcc-s1 libstdc++6 libc6 zlib1g"
additional_packages="libssl3t64 libncurses6 libtinfo6"
additional_packages="libusb-1.0-0 libudev1"
additional_packages="liblz4-1 libjsoncpp25"

# OpenGL / EGL / DRM / Mesa
additional_packages="libgl1 libegl1 libgbm1 libdrm2"
additional_packages="mesa-utils mesa-utils-extra"

# HarmonyOS Linux Emulator 官方依赖
additional_packages="libpulse0"
additional_packages="libpng16-16t64"
additional_packages="libfontconfig1 libfreetype6"
additional_packages="libglib2.0-0t64"

# X11
additional_packages="libx11-6 libx11-xcb1 libxext6"
additional_packages="libxi6 libxrender1 libxrandr2"
additional_packages="libxcursor1 libxcomposite1 libxdamage1 libxfixes3 libxinerama1"

# XCB
additional_packages="libxcb1"
additional_packages="libxcb-icccm4 libxcb-image0 libxcb-keysyms1"
additional_packages="libxcb-randr0 libxcb-render0 libxcb-render-util0"
additional_packages="libxcb-shape0 libxcb-shm0 libxcb-xinerama0"
additional_packages="libxcb-xkb1 libxcb-xfixes0 libxcb-cursor0"

# XKB / X session
additional_packages="libxkbcommon0 libxkbcommon-x11-0"
additional_packages="libsm6 libice6"

# 常见 GUI / 音频运行库
additional_packages="libgtk-3-0t64"
additional_packages="libasound2t64"
additional_packages="libnss3"
additional_packages="shared-mime-info"
