log syslog all;

define OWNAS = 4242422796;

define OWN_AGGREGATE_V4 = [ 172.21.92.32/27 ];
define OWN_AGGREGATE_V6 = [ fd1d:2d70:1e77::/48 ];

define OWN_INTERNAL_V4 = [ 172.21.92.32/27+ ];
define OWN_INTERNAL_V6 = [ fd1d:2d70:1e77::/48+ ];

function is_own_aggregate_v4() -> bool {
  return net ~ OWN_AGGREGATE_V4;
}

function is_own_aggregate_v6() -> bool {
  return net ~ OWN_AGGREGATE_V6;
}

function is_own_internal_v4() -> bool {
  return net ~ OWN_INTERNAL_V4;
}

function is_own_internal_v6() -> bool {
  return net ~ OWN_INTERNAL_V6;
}

function is_valid_network() -> bool {
  return net ~ [
    172.20.0.0/14{21,29}, # dn42
    172.20.0.0/24{28,32}, # dn42 Anycast
    172.21.0.0/24{28,32}, # dn42 Anycast
    172.22.0.0/24{28,32}, # dn42 Anycast
    172.23.0.0/24{28,32}, # dn42 Anycast
    172.31.0.0/16+,       # ChaosVPN
    10.100.0.0/14+,       # ChaosVPN
    10.127.0.0/16+,       # neonetwork
    10.0.0.0/8{15,24}     # Freifunk.net
  ];
}

function is_valid_network_v6() -> bool {
  return net ~ [
    fd00::/8{44,64} # ULA address space as per RFC 4193
  ];
}

roa4 table dn42_roa;
roa6 table dn42_roa_v6;

protocol static {
  roa4 { table dn42_roa; };
  include "/etc/bird/roa_dn42.conf";
};

protocol static {
  roa6 { table dn42_roa_v6; };
  include "/etc/bird/roa_dn42_v6.conf";
};

template bgp dnpeers {
  local as OWNAS;
  path metric on;
  graceful restart on;

  ipv4 {
    import filter {
      if !is_valid_network() then reject;
      if is_own_internal_v4() then reject;
      if bgp_path ~ [= * OWNAS * =] then reject;

      if roa_check(dn42_roa, net, bgp_path.last) != ROA_VALID then {
        print "[dn42] ROA check failed for ", net, " ASN ", bgp_path.last;
        reject;
      }

      accept;
    };

    export filter {
      if source = RTS_STATIC && is_own_aggregate_v4() then accept;
      reject;
    };

    import limit 9000 action block;
  };

  ipv6 {
    import filter {
      if !is_valid_network_v6() then reject;
      if is_own_internal_v6() then reject;
      if bgp_path ~ [= * OWNAS * =] then reject;

      if roa_check(dn42_roa_v6, net, bgp_path.last) != ROA_VALID then {
        print "[dn42] ROA6 check failed for ", net, " ASN ", bgp_path.last;
        reject;
      }

      accept;
    };

    export filter {
      if source = RTS_STATIC && is_own_aggregate_v6() then accept;
      reject;
    };

    import limit 9000 action block;
  };
}

# iBGP filter
filter ibgp_import_v4 {
  if bgp_path ~ [= * OWNAS * =] then reject;

  if is_own_internal_v4() then accept;
  if is_valid_network() then accept;

  reject;
}

filter ibgp_import_v6 {
  if bgp_path ~ [= * OWNAS * =] then reject;

  if is_own_internal_v6() then accept;
  if is_valid_network_v6() then accept;

  reject;
}
