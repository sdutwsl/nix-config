filter ibgp_export_v4 {
  if proto = "direct_lo" && is_own_internal_v4() then accept;
  if source = RTS_STATIC && is_own_aggregate_v4() then accept;
  # 此主机为出口点 需要导出DN42路由表
  if source = RTS_BGP && is_valid_network() then accept;

  reject;
}

filter ibgp_export_v6 {
  if proto = "direct_lo" && is_own_internal_v6() then accept;
  if source = RTS_STATIC && is_own_aggregate_v6() then accept;
  # 此主机为出口点 需要导出DN42路由表
  if source = RTS_BGP && is_valid_network_v6() then accept;

  reject;
}

template bgp ibgp_fullmesh {
  local as OWNAS;
  multihop 64;

  ipv4 {
    extended next hop on;
    # iBGP需要设置下一条为本机地址
    next hop self;

    import filter ibgp_import_v4;
    export filter ibgp_export_v4;
  };

  ipv6 {
    next hop self;

    import filter ibgp_import_v6;
    export filter ibgp_export_v6;
  };
}
