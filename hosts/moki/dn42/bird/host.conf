define OWNIP = 172.21.92.33;
define OWNIPv6 = fd1d:2d70:1e77::1;

router id OWNIP;

protocol device {
  scan time 10;
}

protocol kernel kernel_v4 {
  scan time 20;

  ipv4 {
    import none;
    export filter {
      if source = RTS_BGP then {
        krt_prefsrc = OWNIP;
        accept;
      }

      if source = RTS_STATIC && is_own_aggregate_v4() then accept;

      reject;
    };
  };
}

protocol kernel kernel_v6 {
  scan time 20;

  ipv6 {
    import none;
    export filter {
      if source = RTS_BGP then {
        krt_prefsrc = OWNIPv6;
        accept;
      }

      if source = RTS_STATIC && is_own_aggregate_v6() then accept;

      reject;
    };
  };
}

protocol static static_v4 {
  route 172.21.92.32/27 reject;

  ipv4 {
    import all;
    export none;
  };
}

protocol static static_v6 {
  route fd1d:2d70:1e77::/48 reject;

  ipv6 {
    import all;
    export none;
  };
}

# 导入本地ipv4
protocol direct direct_lo {
  interface "lo";

  ipv4 {
    import filter {
      if is_own_internal_v4() then accept;
      reject;
    };
  };

  ipv6 {
    import filter {
      if is_own_internal_v6() then accept;
      reject;
    };
  };
}
# 导入wg邻居的路由
protocol direct direct_wg_transport {
  interface "wg-bb-hk";

  ipv6 {
    import filter {
      if net = fd1d:2d70:1e77:ff01::/64 then accept;
      reject;
    };
  };
}